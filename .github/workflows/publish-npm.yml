name: Publish NPM Package

on:
  push:
    branches: ['main']
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build MCP CLI & Web bundle
        run: npm run build

      - name: Check version & Publish to NPM
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Inspecting $PACKAGE_NAME version $CURRENT_VERSION..."

          # Check if version already exists on npm
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish."
            exit 0
          fi

          echo "Publishing $PACKAGE_NAME@$CURRENT_VERSION to npm..."
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
